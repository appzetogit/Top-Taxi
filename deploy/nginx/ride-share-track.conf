# Ride safety share: public live-tracking page for a shared ride link.
# Goes inside the gogo.org.in `server { … }` block, before `location / {`.
# /track/ride/<token>  ->  backend /api/v1/taxi/share/view/<token>
location ^~ /track/ride/ {
    proxy_pass http://127.0.0.1:5000/api/v1/taxi/share/view/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
